<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>강점 찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, a deck of tappable cards, a fixed bottom bar that counts picks.
   Selection is a yellow highlighter stroke; the four talent colours stay hidden until the result. */
:root{
  --bg:#F3F2F8; --surface:#FFFFFF; --fg:#1B1740; --muted:#625F80; --line:#D9D6E8;
  --hl:#FFE647; --on-hl:#1B1740; --tl:.5; --tch:.16; --pl:.955; --pc:.035; --chip:#1B1740;
  --ibg:#2B1D6E; --ifg:#F6F3FF; --imuted:#C3B9EE; --isurf:#3B2C8A; --iline:#5646A8;
  --c-lead:#A3217A; --c-coop:#C25A00; --c-friend:#15803D; --c-create:#1D5FBF;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14112B; --surface:#1F1B3D; --fg:#EFEDFA; --muted:#A5A1C4; --line:#3A3563;
  --hl:#FFE647; --on-hl:#1B1740; --tl:.8; --tch:.12; --pl:.21; --pc:.045; --chip:#1B1740;
  --ibg:#1D1450; --ifg:#F6F3FF; --imuted:#B4AAE0; --isurf:#2C2170; --iline:#46398F;
  --c-lead:#F07AC6; --c-coop:#FFA24D; --c-friend:#5FD48A; --c-create:#7DB2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14112B; --surface:#1F1B3D; --fg:#EFEDFA; --muted:#A5A1C4; --line:#3A3563;
  --hl:#FFE647; --on-hl:#1B1740; --tl:.8; --tch:.12; --pl:.21; --pc:.045; --chip:#1B1740;
  --ibg:#1D1450; --ifg:#F6F3FF; --imuted:#B4AAE0; --isurf:#2C2170; --iline:#46398F;
  --c-lead:#F07AC6; --c-coop:#FFA24D; --c-friend:#5FD48A; --c-create:#7DB2FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:24px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
mark{background:var(--hl);color:var(--on-hl);padding:0 .2em;border-radius:3px}

[data-t="lead"]{--tc:var(--c-lead)} [data-t="coop"]{--tc:var(--c-coop)}
[data-t="friend"]{--tc:var(--c-friend)} [data-t="create"]{--tc:var(--c-create)}

.hue{--tc:oklch(var(--tl) var(--tch) var(--h))}
/* type cards */
.tcard{position:relative;display:grid;gap:10px;text-align:left;min-width:0;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);transition:transform .12s ease}
.tcard:active{transform:scale(.98)}
.tcard .tn{font-weight:700;font-size:19px;line-height:1.2;color:var(--tc);padding-right:34px}
.tcard .tg{font-size:14px;color:var(--muted);margin-top:-6px}
.tcard .kw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tcard .kw span{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:10px 4px;border-radius:10px;
  background:color-mix(in srgb,var(--tc) 13%,var(--surface));color:var(--tc);font-size:14px;font-weight:700}
.tcard .badge{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.tcard .badge svg{width:16px;height:16px;stroke-width:3}
.tcard[aria-pressed="true"]{border-color:var(--tc);box-shadow:inset 0 0 0 1.5px var(--tc),0 0 0 4px var(--hl);background:color-mix(in srgb,var(--tc) 8%,var(--surface))}
.tcard[aria-pressed="true"] .badge{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.group{display:grid;gap:8px}
.group h3{font-size:15px;font-weight:700;color:var(--tc)}
/* intro: a deep-violet poster. Strength chips drift across, 강점 is the one yellow object. */
body[data-screen="intro"]{background:var(--ibg);color:var(--ifg)}
.intro{display:flex;flex-direction:column;gap:22px}
.pill{align-self:flex-start;font-size:12.5px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:1.5px solid var(--iline);color:var(--imuted)}
.intro h1{font-size:clamp(38px,12.4vw,60px);line-height:1.05;white-space:nowrap}
.intro h1 em{font-style:normal;color:var(--hl)}
.lede{font-size:17px;color:var(--ifg)}
.lede b{color:var(--hl);font-weight:700}
.drift{display:grid;gap:10px;margin-inline:-16px;overflow:hidden;padding-block:2px}
.drift .row{display:flex;gap:10px;width:max-content;animation:drift 38s linear infinite}
.drift .row.rev{animation-direction:reverse;animation-duration:46s}
.drift .chip{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;font-weight:700;font-size:15px;
  background:oklch(.87 .11 var(--h));color:#1B1740;white-space:nowrap}
.drift .chip svg.ic{width:18px;height:18px;stroke-width:2}
@keyframes drift{to{transform:translateX(-50%)}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.vs button{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:18px;padding:16px 14px;min-width:0;border:1.5px solid var(--iline);background:var(--isurf);color:var(--ifg)}
.vs .k{font-family:var(--display);font-size:30px;line-height:1.1}
.vs .m{font-size:14.5px;line-height:1.4}
.vs .ex{font-size:13.5px;line-height:1.4;padding-top:8px;border-top:1.5px dashed currentColor;margin-top:auto}
.vs .tap{font-size:12.5px;font-weight:700;margin-top:auto;opacity:.8}
.vs .strong{background:var(--hl);color:var(--on-hl);border-color:var(--hl);transform:rotate(1.5deg);box-shadow:0 10px 0 -4px rgba(0,0,0,.28)}
.vs .tag{align-self:flex-start;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--on-hl);color:var(--hl)}
.vs .weak .tag{background:transparent;border:1.5px solid var(--iline);color:var(--imuted)}
.vs button:focus-visible{outline-color:var(--ifg)}
.how{display:grid;gap:10px}
.how h2{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--imuted)}
.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.funnel div{display:flex;flex-direction:column;gap:4px;background:var(--isurf);border:1.5px solid var(--iline);border-radius:16px;padding:12px;min-width:0}
.funnel .n{font-family:var(--display);font-size:44px;line-height:1;color:var(--hl)}
.funnel .s{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--imuted)}
.funnel .t{font-size:13.5px;line-height:1.35}
.funnel div:last-child{background:var(--ifg);border-color:var(--ifg);color:var(--ibg)}
.funnel div:last-child .n{color:var(--ibg)}
.funnel div:last-child .s{color:var(--ibg);opacity:.7}
.note{font-size:14.5px;color:var(--imuted)}
.intro .cta{background:var(--hl);color:var(--on-hl);font-size:18px;padding:18px;border-radius:16px}
.intro .cta:focus-visible{outline-color:var(--ifg)}
@media (prefers-reduced-motion:reduce){.drift .row{animation:none}}
.cta{width:100%;border:0;border-radius:14px;background:var(--fg);color:var(--surface);font-weight:700;font-size:17px;padding:16px}

/* step head */
.head{display:flex;flex-direction:column;gap:10px}
.head h2{font-size:32px;line-height:1.25}
.head .eyebrow{align-self:flex-start;background:var(--pfg);color:var(--chip);text-shadow:none;padding:5px 12px;border-radius:999px;letter-spacing:.04em}
.head mark{background:var(--pmark);color:var(--chip);padding:0 .18em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.head .muted{color:var(--pmuted);font-weight:500}
body[data-screen="s2"] .head,body[data-screen="s3"] .head,body[data-screen="s3"] .group h3{text-shadow:0 1px 2px rgba(0,0,0,.28)}
.head mark{text-shadow:none}
.order{background:#1B1740;color:#FFFFFF;border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.order b{font-size:18px}
.order p{font-size:14px;line-height:1.45}
.order .seq{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:700}
.order .seq span{display:flex;align-items:center;gap:6px}
.order .seq i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--hl);color:var(--on-hl);display:grid;place-items:center;font-size:13px}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog i{height:6px;border-radius:3px;background:color-mix(in srgb,var(--pfg) 28%,transparent)}
.prog i.on{background:var(--pfg)}
/* step and result pages: a coloured page with white cards. The cards keep the light palette in either theme. */
body[data-screen="s1"]{--bg:oklch(.53 .17 298);--pfg:#FFFFFF;--pmuted:#EAE2FF;--pmark:var(--hl)}
body[data-screen="s2"]{--bg:oklch(.7 .14 152);--pfg:#FFFFFF;--pmuted:#FFFFFF;--pmark:var(--hl)}
body[data-screen="s3"]{--bg:oklch(.68 .18 50);--pfg:#FFFFFF;--pmuted:#FFFFFF;--pmark:var(--hl)}
body[data-screen="result"]{--bg:var(--ibg);--pfg:#F6F3FF;--pmuted:var(--imuted);--pmark:var(--hl)}
body[data-screen="s1"],body[data-screen="s2"],body[data-screen="s3"],body[data-screen="result"]{
  --surface:#FFFFFF; --fg:#1B1740; --muted:#625F80; --line:#D9D6E8; --tl:.5; --tch:.16;
  --c-lead:#A3217A; --c-coop:#C25A00; --c-friend:#15803D; --c-create:#1D5FBF;
  background:var(--bg);color:var(--pfg);color-scheme:light}
.res,.talent,details,.bar,.bars{color:var(--fg)}
.group h3{color:var(--pfg)}
body h3.sec{color:var(--pmuted)}
.bars{background:var(--surface);border-radius:14px;padding:14px}
body .ghost{border-color:color-mix(in srgb,var(--pfg) 45%,transparent)}
body[data-screen="result"] .cta{background:var(--hl);color:var(--on-hl)}


/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:grid;gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;
  padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);
  transition:transform .12s ease,background-color .12s ease}
.card:active{transform:scale(.97)}
.card .w{font-weight:700;font-size:18px;line-height:1.2}
.card .d{font-size:13.5px;line-height:1.4;color:var(--muted)}
.card[aria-pressed="true"]{background:var(--hl);color:var(--on-hl);border-color:var(--on-hl)}
.card[aria-pressed="true"] .d{color:var(--on-hl)}
.card .badge{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;
  background:var(--on-hl);color:var(--hl);font-size:13px;font-weight:700}
.card[aria-pressed="true"] .badge{display:grid}
.card .badge svg{width:15px;height:15px;stroke-width:3}
.list .card{flex-direction:row;align-items:center;gap:14px;padding:16px}
.list .card svg.ic{width:30px;height:30px}
.list .card .t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:28px}
.list .card .w{font-size:20px}
.list .card .d{font-size:14.5px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .back{border:1.5px solid var(--line);background:transparent;border-radius:12px;height:48px;padding:0 14px 0 10px;display:flex;align-items:center;gap:4px;font-weight:700;flex:none}
.bar .back svg.ic{width:20px;height:20px}
.bar .count{flex:1;min-width:0;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.bar .count b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--fg)}
.bar .next{border:0;border-radius:12px;height:48px;padding:0 20px;background:var(--fg);color:var(--surface);font-weight:700;flex:none}
.bar .next:disabled{background:var(--line);color:var(--muted);cursor:default}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:#1B1740;color:#FFFFFF;padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* result */
.top3{display:grid;gap:12px}
.res{background:var(--surface);border:1.5px solid var(--tc);border-radius:16px;padding:16px;display:grid;gap:12px}
.res .row{display:flex;gap:14px;align-items:center}
.res .rank{font-family:var(--display);font-size:40px;line-height:1;color:var(--tc);width:.7em}
.res .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc)}
.res .ico svg.ic{width:28px;height:28px}
.res .w{font-weight:700;font-size:22px;line-height:1.2}
.res .d{font-size:14.5px;color:var(--muted)}
.res .meta{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:6px;font-size:14.5px}
.res .meta dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.res .meta dt{color:var(--muted)} .res .meta dd{margin:0;font-weight:700}
.res .meta dd span{font-weight:400;color:var(--muted)}
.tname{color:var(--tc)}
.talent{background:color-mix(in srgb,var(--tc) 12%,var(--surface));border-radius:20px;padding:22px 18px;display:grid;gap:16px}
.talent h2{font-size:44px;color:var(--tc)}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:4.2em 1fr 1.5em;gap:8px;align-items:center;font-size:14px}
.bars .track{height:12px;border-radius:6px;background:color-mix(in srgb,var(--tc) 18%,var(--surface))}
.bars .fill{height:100%;border-radius:6px;background:var(--tc)}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.qa{display:grid;gap:12px}
.qa div{display:grid;gap:2px}
.qa div.chips{display:flex;gap:6px}
.qa dt,.qa .q{font-weight:700;font-size:14px;color:var(--tc)}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jobs div{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.jobs b{font-size:14.5px;line-height:1.3}
.jobs span{font-size:12.5px;line-height:1.35;color:var(--muted)}
.catch{font-weight:700;font-size:17px}
.rec{display:grid;gap:10px}
.rec section{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.rec h4{margin:0;font-size:13px;font-weight:700;color:var(--tc);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.rec h4 small{font-size:12px;font-weight:400;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.rec ul[hidden]{display:none}
.tabs button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.rec .ask{font-size:13px;color:var(--muted);border-top:1.5px dashed var(--line);padding-top:8px}
.rec ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rec li{display:grid;gap:1px;min-width:0}
.rec li b{font-size:15px;line-height:1.3}
.rec li span{font-size:13px;line-height:1.4;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13.5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 16px}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;font-weight:700;color:var(--tc);cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .body{display:grid;gap:14px;padding-bottom:16px}
.others{display:grid;gap:10px}
.actions{display:grid;gap:10px}
.ghost{width:100%;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:14px;font-weight:700}
h3.sec{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div id="app"></div>
<div id="bar" class="bar" hidden></div>

  st.p10.forEach(i=>c10[TYPES[i][1]]++);
  const first=S[st.p3[0]].talent;
  const best=TORDER.slice().sort((a,b)=>sc[b]-sc[a]||c10[b]-c10[a]||(b===first)-(a===first))[0];
  return {best,c10,n:st.p3.filter(i=>S[i].talent===best).length};
}

function render(){
  const app=$('app'), bar=$('bar'); let h='';
  document.body.dataset.screen=st.step;
  if(st.step==='intro'){
    bar.hidden=true;
    const chip=k=>{const x=S.find(v=>v.w===k);return `<span class="chip" style="--h:${HUES[x.ti]}">${ic(k)}${k}</span>`};
    const rowA=['정열','통찰','유머','끈기','배려','창의','리더십','공정','감성','호기심'].map(chip).join('');
    const rowB=['추진','집중','재치','연구','위로','개성','극복','교감','감사','발상'].map(chip).join('');
    const ex=k=>st.ex===k;
    h=`<div class="intro">
    <span class="pill">STRENGTH FINDER</span>
    <h1>나의 <em>강점</em> 찾기</h1>
    <p class="lede">20가지 유형, 60개의 강점 중에서<br><b>진짜 내 것 3개</b>를 골라내요.</p>
    <div class="drift" aria-hidden="true"><div class="row">${rowA}${rowA}</div><div class="row rev">${rowB}${rowB}</div></div>
    <div class="vs">
      <button class="weak" data-act="ex" data-k="a" aria-expanded="${ex('a')}"><span class="tag">누구나 있는 것</span><span class="k">장점</span><span class="m">좋거나, 잘하거나, 긍정적인 점</span>${ex('a')?'<span class="ex">예) “나는 친절한 편이야.”</span>':'<span class="tap">눌러서 예시 보기</span>'}</button>
      <button class="strong" data-act="ex" data-k="b" aria-expanded="${ex('b')}"><span class="tag">오늘 찾을 것</span><span class="k">강점</span><span class="m">남보다 우세하거나 더 뛰어난 점</span>${ex('b')?'<span class="ex">예) “친구 고민은 우리 반에서 내가 제일 잘 들어 줘.”</span>':'<span class="tap">눌러서 예시 보기</span>'}</button>
    </div>
    <section class="how"><h2>이렇게 좁혀 가요</h2>
      <div class="funnel">
        <div><span class="s">STEP 1</span><span class="n">10</span><span class="t">어울리는 강점유형 고르기</span></div>
        <div><span class="s">STEP 2</span><span class="n">5</span><span class="t">더 나다운 유형 선택하기</span></div>
        <div><span class="s">STEP 3</span><span class="n">3</span><span class="t">최종 강점을 순위대로</span></div>
      </div>
    </section>
    <p class="note">정답은 없어요. 되고 싶은 모습 말고, 지금의 나와 가까운 것을 고르세요.</p>
    <button class="cta" data-act="start">시작하기 →</button>
    </div>`;
  } else if(st.step==='result'){
    bar.hidden=true;
    const {best,c10,n}=mainTalent(), T=TALENTS[best];
    const why = n>=2 ? `TOP 3 가운데 ${n}개가 ${T.short}에 속해요.` : `1순위로 고른 ‘${S[st.p3[0]].w}’ 강점이 ${T.short}에 속해요.`;
    h=`<div class="head"><p class="eyebrow">RESULT</p><h2>나의 강점 <mark>TOP 3</mark></h2></div>
    <div class="top3">${st.p3.map((i,r)=>{const s=S[i];return `<article class="res" data-t="${s.talent}">
      <div class="row"><span class="rank">${r+1}</span><span class="ico">${ic(s.w)}</span><div><div class="w">${s.w}</div><div class="d">${s.d}</div></div></div>
      <div class="meta"><dl><dt>강점유형</dt><dd>${s.type} <span>${s.sib.join(' · ')}</span></dd><dt>인재유형</dt><dd class="tname">${TALENTS[s.talent].name}</dd></dl></div>
    </article>`}).join('')}</div>
    <section class="talent" data-t="${best}">
      <div><p class="eyebrow">나의 인재유형</p><h2>${T.name}</h2><p class="muted">${why}</p></div>
      ${talentBody(best)}
    </section>
    <h3 class="sec">처음 고른 강점유형 10개는 어디에 모였을까?</h3>
    <div class="bars">${TORDER.map(t=>`<div class="b" data-t="${t}"><span>${TALENTS[t].short}</span><div class="track"><div class="fill" style="width:${c10[t]*10}%"></div></div><span class="n">${c10[t]}</span></div>`).join('')}</div>
    <h3 class="sec">다른 인재유형도 살펴보기</h3>
    <div class="others">${TORDER.filter(t=>t!==best).map(t=>`<details data-t="${t}"><summary>${TALENTS[t].name}</summary><div class="body">${talentBody(t)}</div></details>`).join('')}</div>
    <div class="actions">
      <button class="cta" data-act="copy" id="copyBtn">결과 복사하기</button>
      <button class="ghost" data-act="redo">이전 단계로 돌아가 강점 다시 고르기</button>
      <button class="ghost" data-act="reset" id="resetBtn">처음부터 다시 하기</button>
    </div>`;
  } else {
    const lim=LIMIT[st.step], p=picks(), n={s1:1,s2:2,s3:3}[st.step];
    const title={s1:'나에게 어울리는 강점유형 <mark>10개</mark>',s2:'더 나다운 강점유형 <mark>5개</mark>',s3:'최종 강점 3개, <mark>순위대로</mark>'}[st.step];
    const sub={s1:'유형마다 강점 3개가 묶여 있어요. 유형 이름이 어렵다면 강점 3개를 보고 고르세요.',s2:'고른 10개 중에서 “이건 정말 나다” 싶은 유형을 선택해요.',s3:'선택한 유형의 강점 15개 중에서 골라요.'}[st.step];
    h=`<div class="head"><div class="prog" aria-hidden="true">${[1,2,3].map(k=>`<i class="${k<=n?'on':''}"></i>`).join('')}</div><p class="eyebrow">${n}단계 / 3단계</p><h2>${title}</h2><p class="muted">${sub}</p></div>`;
    if(st.step==='s3') h+=`<div class="order"><b>누른 순서가 곧 순위예요</b><div class="seq"><span><i>1</i>가장 나다운 강점</span><span><i>2</i>그다음</span><span><i>3</i>그다음</span></div><p>아무거나 3개가 아니라, 1순위부터 차례로 눌러 주세요. 순서를 바꾸려면 다시 눌러 취소하면 돼요.</p></div>`;
    const asc=a=>a.slice().sort((x,y)=>x-y);
    if(st.step==='s1') h+=`<div class="list">${TYPES.map((_,i)=>tcard(i)).join('')}</div>`;
    else if(st.step==='s2') h+=`<div class="list">${asc(st.p10).map(tcard).join('')}</div>`;
    else h+=asc(st.p5).map(ti=>`<section class="group hue" style="--h:${HUES[ti]}"><h3>${TYPES[ti][0]}</h3><div class="list">${S.map((x,i)=>x.ti===ti?rowCard(i,true):'').join('')}</div></section>`).join('');
    bar.hidden=false;
    bar.innerHTML=`<div class="bar-in"><button class="back" data-act="back"><svg class="ic" viewBox="0 0 24 24">${ICONS._back}</svg>이전</button>
      <div class="count">${st.step==='s3'?(p.length<3?`<b>${p.length+1}순위</b>를 눌러 주세요`:`<b>3</b> / 3개 선택 완료`):`<b>${p.length}</b> / ${lim}개 선택`}</div>
      <button class="next" data-act="next" ${p.length===lim?'':'disabled'}>${st.step==='s3'?'결과 보기':'다음'}</button></div>`;
  }
  app.innerHTML=h;
}

let actx;
function tick(on){ // light, clear UI click: a very short pure tone that drops in pitch, no noise
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(on?1900:1400,t);
    o.frequency.exponentialRampToValueAtTime(on?1250:900,t+0.04);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(on?0.18:0.12,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.06);
  }catch(e){}
}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,1800)}
function go(step){st.step=step;resetArmed=false;save();render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-ind]');
  if(tab){const box=tab.closest('.cos');
    box.querySelectorAll('[data-ind]').forEach(b=>b.setAttribute('aria-selected',b===tab));
    box.querySelectorAll('[data-panel]').forEach(u=>u.hidden=u.dataset.panel!==tab.dataset.ind);return}
  const pk=e.target.closest('[data-pick]'), ac=e.target.closest('[data-act]');
  if(pk){
    const i=+pk.dataset.pick, p=picks(), lim=LIMIT[st.step], at=p.indexOf(i);
    if(at>=0){p.splice(at,1);tick(false)}
    else if(p.length>=lim){toast(`${lim}개를 모두 골랐어요. 바꾸려면 하나를 먼저 취소하세요.`);return}
    else{p.push(i);tick(true);if(st.step==='s3')toast(`${p.length}순위: ${S[i].w}`)}
    save();
    const y=window.scrollY; render(); window.scrollTo(0,y);
    return;
  }
  if(!ac) return;
  const a=ac.dataset.act;
  if(a==='start'){go('s1')}
  else if(a==='ex'){st.ex=st.ex===ac.dataset.k?null:ac.dataset.k;const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='next'){
    if(st.step==='s1'){st.p5=st.p5.filter(i=>st.p10.includes(i));st.p3=st.p3.filter(i=>st.p5.includes(S[i].ti));go('s2')}
    else if(st.step==='s2'){st.p3=st.p3.filter(i=>st.p5.includes(S[i].ti));go('s3')}
    else go('result');
  }
  else if(a==='redo'){go('s3')}
  else if(a==='back'){go({s1:'intro',s2:'s1',s3:'s2'}[st.step])}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;$('resetBtn').textContent='한 번 더 누르면 처음으로 돌아가요';return}
    st={step:'intro',p10:[],p5:[],p3:[]};go('intro');
  }
  else if(a==='copy'){
    const {best}=mainTalent();
    const txt='[강점 찾기 결과]\n'+st.p3.map((i,r)=>`${r+1}. ${S[i].w} (${S[i].type} · ${TALENTS[S[i].talent].name})`).join('\n')+`\n나의 인재유형: ${TALENTS[best].name}`;
    const done=ok=>toast(ok?'결과를 복사했어요.':'복사가 안 돼요. 화면을 캡처해 주세요.');
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}catch(err){done(false)}
  }
});

function start(){
  load();
  if(st.step==='result'&&st.p3.length!==3) st.step='s3';
  if(st.step==='s3'&&st.p5.length!==5) st.step='s2';
  if(st.step==='s2'&&st.p10.length!==10) st.step='s1';
  render();
}
start();
</script>

</body></html>
